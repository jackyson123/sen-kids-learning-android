plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jackyson.senkidslearning'
    compileSdk 35

    defaultConfig {
        applicationId "com.jackyson.senkidslearning"
        minSdk 23
        targetSdk 35
        // versionName 會跟住網頁版 SEN app 嘅版本（而家係 2.3.0）。
        versionCode 1
        versionName "2.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity helper：將 https://sen-kids-learning.vercel.app/ 包成 Android app。
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    // AppCompat：styles.xml 用咗 Theme.AppCompat.Light.NoActionBar，冇呢個依賴會 build 失敗。
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // 修正第二次 build 失敗：kotlin-stdlib 1.8.22 同 1.6.21 重複 class。
    // Kotlin 1.8 起已將 jdk7 / jdk8 合併入 stdlib，舊版 jdk7 / jdk8 殘留先會撞名，
    // 所以排除佢哋，並將 stdlib 統一鎖定做圖入面已有嘅較新版 1.8.22。
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
