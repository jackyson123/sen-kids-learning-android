plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jackyson.senkidslearning'
    compileSdk 35

    defaultConfig {
        applicationId "com.jackyson.senkidslearning"
        minSdk 23
        targetSdk 35
        // versionName 會跟住網頁版 SEN app 嘅版本（而家係 2.3.0）。
        versionCode 1
        versionName "2.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity helper：將 https://sen-kids-learning.vercel.app/ 包成 Android app。
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
